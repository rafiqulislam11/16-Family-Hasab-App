<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Badge -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Outer Ring Accent -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Inner Dynamic Accent Arc / Ring -->
  <circle cx="256" cy="226" r="148" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" stroke-dasharray="24 12" stroke-opacity="0.45" />

  <!-- Hexagonal / Shield Core -->
  <path d="M 256 90 L 376 156 L 376 296 L 256 364 L 136 296 L 136 156 Z" fill="#0B132B" fill-opacity="0.7" stroke="url(#goldGrad)" stroke-width="5" />

  <!-- Brand RI Monogram -->
  <!-- Letter R -->
  <path d="M 172 170 L 228 170 C 252 170 266 182 266 200 C 266 216 254 228 234 231 L 268 284 L 244 284 L 214 236 L 194 236 L 194 284 L 172 284 Z M 194 188 L 194 218 L 226 218 C 238 218 245 211 245 203 C 245 194 238 188 226 188 Z" fill="#FFFFFF" />
  
  <!-- Letter I -->
  <path d="M 286 170 L 334 170 L 334 188 L 321 188 L 321 266 L 334 266 L 334 284 L 286 284 L 286 266 L 299 266 L 299 188 L 286 188 Z" fill="url(#goldGrad)" />

  <!-- Bengali Taka ৳ Emblem at Center Top -->
  <circle cx="256" cy="125" r="22" fill="url(#emeraldGrad)" />
  <text x="256" y="133" font-family="'Hind Siliguri', 'Noto Sans Bengali', Arial, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">৳</text>

  <!-- Brand Name Ribbon / Text at Bottom -->
  <rect x="76" y="388" width="360" height="60" rx="30" fill="#0B132B" stroke="url(#goldGrad)" stroke-width="2" />
  <text x="256" y="426" font-family="'Hind Siliguri', 'Anek Bangla', sans-serif" font-size="24" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="1.5">RI HISAB • হিসাব</text>
</svg>
